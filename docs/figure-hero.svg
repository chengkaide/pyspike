<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 312" role="img"
         aria-label="双稀释剂法三部曲：仪器分馏把比值改歪、掺入两个富集同位素、一次反演解出三个未知量"
         font-family="-apple-system, Segoe UI, Microsoft YaHei, sans-serif">
      <rect x="0.5" y="0.5" width="679" height="311" rx="14" fill="#ffffff" stroke="#e2ddd3"/>

      <text x="24" y="58" font-size="12.5" font-weight="600" fill="#23201c">① 仪器把比值改歪了</text>
      <line x1="24" y1="70" x2="220" y2="70" stroke="#e2ddd3"/>
      <g>
        <rect x="24" y="79" width="10" height="7" fill="none" stroke="#8b8479" stroke-dasharray="3 2"/>
        <text x="39" y="86" font-size="9.5" fill="#8b8479">天然</text>
        <rect x="76" y="79" width="10" height="7" fill="#9c4221" opacity="0.85"/>
        <text x="91" y="86" font-size="9.5" fill="#8b8479">实测</text>
      </g>
      <g>
        <rect x="52"  y="118" width="32" height="88" fill="none" stroke="#8b8479" stroke-dasharray="4 3"/>
        <rect x="104" y="168" width="32" height="38" fill="none" stroke="#8b8479" stroke-dasharray="4 3"/>
        <rect x="156" y="186" width="32" height="20" fill="none" stroke="#8b8479" stroke-dasharray="4 3"/>
      </g>
      <g>
        <rect x="52"  y="102" width="32" height="104" fill="#9c4221" opacity="0.85"/>
        <rect x="104" y="174" width="32" height="32"  fill="#9c4221" opacity="0.85"/>
        <rect x="156" y="194" width="32" height="12"  fill="#9c4221" opacity="0.85"/>
      </g>
      <line x1="32" y1="206" x2="212" y2="206" stroke="#8b8479" stroke-width="1.2"/>
      <text x="68"  y="222" text-anchor="middle" font-size="10.5" fill="#8b8479">56</text>
      <text x="120" y="222" text-anchor="middle" font-size="10.5" fill="#8b8479">57</text>
      <text x="172" y="222" text-anchor="middle" font-size="10.5" fill="#8b8479">58</text>
      <g>
        <text x="24" y="268" font-size="10.5" fill="#5d574e">轻的被抬高、重的被压低。</text>
        <text x="24" y="284" font-size="10.5" fill="#5d574e">偏了多少（β）没人知道。</text>
      </g>

      <text x="242" y="58" font-size="12.5" font-weight="600" fill="#23201c">② 掺两个富集同位素</text>
      <line x1="242" y1="70" x2="438" y2="70" stroke="#e2ddd3"/>
      <g>
        <rect x="270" y="118" width="32" height="88" fill="none" stroke="#8b8479" stroke-dasharray="4 3"/>
        <rect x="322" y="168" width="32" height="38" fill="none" stroke="#8b8479" stroke-dasharray="4 3"/>
        <rect x="374" y="186" width="32" height="20" fill="none" stroke="#8b8479" stroke-dasharray="4 3"/>
      </g>
      <g>
        <rect x="270" y="138" width="32" height="68"  fill="#9c4221" opacity="0.85"/>
        <rect x="322" y="102" width="32" height="104" fill="#9c4221" opacity="0.85"/>
        <rect x="374" y="88"  width="32" height="118" fill="#9c4221" opacity="0.85"/>
      </g>
      <line x1="250" y1="206" x2="430" y2="206" stroke="#8b8479" stroke-width="1.2"/>
      <text x="286" y="222" text-anchor="middle" font-size="10.5" fill="#8b8479">56</text>
      <text x="338" y="222" text-anchor="middle" font-size="10.5" fill="#8b8479">57</text>
      <text x="390" y="222" text-anchor="middle" font-size="10.5" fill="#8b8479">58</text>
      <g>
        <text x="242" y="268" font-size="10.5" fill="#5d574e">57、58 被「抬起来」——</text>
        <text x="242" y="284" font-size="10.5" fill="#5d574e">这个图案分馏造不出来。</text>
      </g>

      <text x="460" y="58" font-size="12.5" font-weight="600" fill="#23201c">③ 三个未知量一次解出</text>
      <line x1="460" y1="70" x2="656" y2="70" stroke="#e2ddd3"/>
      <g>
        <rect x="468" y="100" width="180" height="30" rx="7" fill="#fbfaf7" stroke="#e2ddd3"/>
        <text x="480" y="119" font-size="11.5" fill="#23201c">λ　稀释剂占了多少</text>
      </g>
      <g>
        <rect x="468" y="138" width="180" height="30" rx="7" fill="#f8ece5" stroke="#9c4221"/>
        <text x="480" y="157" font-size="11.5" fill="#23201c">α　样品天然分馏</text>
        <text x="642" y="157" text-anchor="end" font-size="9.5" fill="#9c4221">要报的</text>
      </g>
      <g>
        <rect x="468" y="176" width="180" height="30" rx="7" fill="#fbfaf7" stroke="#e2ddd3"/>
        <text x="480" y="195" font-size="11.5" fill="#23201c">β　仪器分馏</text>
        <text x="642" y="195" text-anchor="end" font-size="9.5" fill="#8b8479">要消掉的</text>
        <polygon points="554,210 562,210 558,218" fill="#8b8479"/>
        <rect x="468" y="222" width="180" height="30" rx="7" fill="#e7f2ec" stroke="#1f6f4a"/>
        <text x="558" y="241" text-anchor="middle" font-size="11.5" fill="#1f6f4a">一次反演解出三个</text>
      </g>
      <g>
        <text x="460" y="268" font-size="10.5" fill="#5d574e">非天然图案「锁」住 λ，</text>
        <text x="460" y="284" font-size="10.5" fill="#5d574e">三个量一起解。</text>
      </g>
    </svg>
